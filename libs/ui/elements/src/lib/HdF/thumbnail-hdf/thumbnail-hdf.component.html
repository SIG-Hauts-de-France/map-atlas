<div
  #containerElement
  class="h-full w-full relative shrink-0 overflow-hidden flex items-center justify-center"
  [ngClass]="isPlaceholder ? 'bg-gray-100' : 'bg-white'"
  [attr.data-cy-is-placeholder]="isPlaceholder.toString()"
>
  <img
    #imageElement
    class="relative object-center h-full"
    [ngStyle]="{ 
      objectFit: imgFit,
      maxHeight: '50vh',
      maxWidth: '100%'
     }"
    alt="thumbnail"
    loading="lazy"
    (load)="setObjectFit()"
    [src]="imgUrl"
    (error)="useFallback()"
  />
</div>
