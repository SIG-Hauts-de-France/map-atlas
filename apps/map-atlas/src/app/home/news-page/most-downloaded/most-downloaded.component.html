
<div class="grid grid-cols-2 gap-4 p-6">
    
    <div *ngFor="let record of records$ | async" class="border rounded-lg" (click)="onMapClick(record)">
        <img 
            *ngIf="record" 
            [src]="record.overviews?.[0]?.url"
            class="w-full h-full object-contain hover:shadow-xl-hover transition-shadow"
            alt="Metadata Image"
            [matTooltip]="record.title"
            matTooltipPosition="above"
        />
    </div>
    
</div>
