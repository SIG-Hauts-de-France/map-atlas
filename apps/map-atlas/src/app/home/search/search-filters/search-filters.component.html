<div
  class="bg-primary text-white p-5 shadow-xl rounded-lg grid grid-cols-6 gap-4"
>
  <!-- Titre + Clear + Tri (sur la même ligne) -->
  <div class="col-span-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
    <div class="flex flex-col sm:flex-row items-baseline justify-start gap-2">
      <h2 class="text-xl font-title" translate>
        search.filters.title
      </h2>
      <button
        type="button"
        class="text-sm opacity-80 hover:opacity-100 transition-opacity clear-btn"
        translate
        (click)="clearFilters()"
        data-cy="clearFilters"
      >
        search.filters.clear
      </button>
    </div>

    <!-- Tri par : aligné à droite sur desktop -->
    <div class="flex-shrink-0">
      <gn-ui-sort-by-hdf
        [isQualitySortable]="isQualitySortable"
      ></gn-ui-sort-by-hdf>
    </div>
  </div>

  <!-- Tous les filtres (toujours visibles) -->
  <div class="col-span-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
    <ng-container *ngIf="(isMobile$ | async) === false">
      <gn-ui-filter-dropdown
        *ngFor="let filter of searchConfig"
        class="w-full"
        [fieldName]="filter.fieldName"
        [title]="filter.title | translate"
      ></gn-ui-filter-dropdown>
    </ng-container>

    <!-- Sur mobile, on affiche aussi tous les filtres -->
    <ng-container *ngIf="(isMobile$ | async) === true">
      <gn-ui-filter-dropdown
        *ngFor="let filter of searchConfig"
        class="w-full"
        [fieldName]="filter.fieldName"
        [title]="filter.title | translate"
      ></gn-ui-filter-dropdown>
    </ng-container>
  </div>

  <!-- Filtres supplémentaires (spatial, mes enregistrements, etc.) -->
  <div class="col-span-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div *ngIf="searchFacade.hasSpatialFilter$ | async">
      <gn-ui-check-toggle
        [title]="'search.filters.useSpatialFilterHelp' | translate"
        [label]="'search.filters.useSpatialFilter' | translate"
        [color]="'secondary'"
        [value]="searchFacade.spatialFilterEnabled$ | async"
        (toggled)="toggleSpatialFilter($event)"
      ></gn-ui-check-toggle>
    </div>

    <div *ngIf="userId">
      <gn-ui-check-toggle
        [title]="'search.filters.myRecordsHelp' | translate"
        [label]="'search.filters.myRecords' | translate"
        [color]="'secondary'"
        [value]="myRecordsFilterEnabled$ | async"
        (toggled)="toggleMyRecordsFilter($event)"
      ></gn-ui-check-toggle>
    </div>

    <div *ngIf="!userId && (myRecordsFilterEnabled$ | async)">
      <gn-ui-button
        type="light"
        extraClass="text-sm align-middle"
        (buttonClick)="toggleMyRecordsFilter(false)"
      >
        <span>{{ 'search.filters.otherRecords' | translate }}</span>
        <ng-icon class="ml-3 opacity-40" name="matCloseOutline"></ng-icon>
      </gn-ui-button>
    </div>
  </div>
</div>
